<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table Sponsors — Days of Wine &amp; Roses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Raleway:wght@400;600;700;800&family=Cormorant+Garamond:ital,wght@1,400;1,600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0E0509;
      --gold:      #C4963A;
      --gold-lt:   #E2B660;
      --cream:     #F5EDE0;
      --rose-pale: #D4A0A8;
      --muted:     rgba(245,237,224,0.5);
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--cream);
      font-family: 'Raleway', sans-serif;
      overflow: hidden;
    }

    /* ── SCROLLING LOGO WALL ─────────────────────────────────── */
    .scroll-wrap {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    .scroll-track {
      width: 100vw;
      display: flex;
      flex-direction: column;
      gap: 0;
      animation: scroll-up 70s linear infinite;
      will-change: transform;
    }
    .scroll-track:hover { animation-play-state: paused; }

    @keyframes scroll-up {
      0%   { transform: translateY(0); }
      100% { transform: translateY(-50%); }
    }

    .logo-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: clamp(16px, 2vw, 36px);
      padding: clamp(16px, 2vw, 36px);
    }

    .logo-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(255,255,255,0.04);
      border-radius: 6px;
      border: 1px solid rgba(196,150,58,0.10);
      min-height: 110px;
    }

    .logo-cell img {
      max-width: 100%;
      max-height: 90px;
      width: auto;
      height: auto;
      object-fit: contain;
      opacity: 0.45;
      filter: brightness(1.15) saturate(0.7);
      transition: opacity 0.3s;
    }

    /* ── DARK VIGNETTE OVER LOGO WALL ───────────────────────── */
    .vignette {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% 50%,
          rgba(14,5,9,0.25) 0%,
          rgba(14,5,9,0.65) 100%),
        linear-gradient(to bottom,
          rgba(14,5,9,0.55) 0%,
          transparent 25%,
          transparent 75%,
          rgba(14,5,9,0.55) 100%);
      pointer-events: none;
    }

    /* ── HEADING OVERLAY ─────────────────────────────────────── */
    .heading-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      gap: 0;
      padding: 0 40px;
    }

    .eyebrow {
      font-size: clamp(0.6rem, 1.1vw, 0.82rem);
      font-weight: 800;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0.85;
      margin-bottom: 1.1rem;
    }

    .main-heading {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(3.5rem, 9vw, 7.5rem);
      color: var(--cream);
      text-align: center;
      line-height: 1.0;
      text-shadow:
        0 0 60px rgba(14,5,9,0.9),
        0 0 120px rgba(14,5,9,0.7),
        0 2px 8px rgba(14,5,9,0.95);
    }

    /* ornament */
    .orn {
      display: flex;
      align-items: center;
      gap: 1rem;
      width: min(480px, 55vw);
      margin: 1.1rem 0 1rem;
    }
    .orn-line {
      flex: 1; height: 1px;
      background: linear-gradient(to right, transparent, var(--gold));
      opacity: 0.55;
    }
    .orn-line.r { background: linear-gradient(to left, transparent, var(--gold)); }
    .orn-gem {
      width: 7px; height: 7px;
      background: var(--gold);
      transform: rotate(45deg);
      opacity: 0.85;
    }

    .sub-heading {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(1rem, 2.2vw, 1.6rem);
      color: var(--muted);
      text-align: center;
      text-shadow: 0 0 30px rgba(14,5,9,0.9);
    }
  </style>
</head>
<body>

  <!-- SCROLLING LOGO WALL -->
  <div class="scroll-wrap">
    <div class="scroll-track" id="track">
      <!-- Two identical grids for seamless loop — built by JS -->
    </div>
  </div>

  <!-- VIGNETTE -->
  <div class="vignette"></div>

  <!-- HEADING -->
  <div class="heading-overlay">
    <p class="eyebrow">Argyle Jazz Cabaret · 2026</p>
    <h1 class="main-heading">Table Sponsors</h1>
    <div class="orn">
      <div class="orn-line"></div>
      <div class="orn-gem"></div>
      <div class="orn-line r"></div>
    </div>
    <p class="sub-heading">Thank you for your generous support</p>
  </div>

  <script>
    const LOGOS = [
      'Artrageous logo.jpg',
      'Aspire_Logo_Landscape_RGB.png',
      'B Fit logo wide est (1).jpeg',
      'Bard on the Beach.png',
      'Bella Ceramica logo.png',
      'COBS logo.png',
      'Cap Bridge logo.png',
      'CapU BlueShore logo.png',
      'Deckheadz skate shop logo.jpg',
      'Deep Cove Kayak logo.png',
      'Deep Cove Music logo.jpg',
      'Delanys_LogoFull_Blue (1).png',
      'Ellison Travel and Tours logo.png',
      'Fairmont Hotels logo.png',
      'Fiorino logo.png',
      'Furry Friends Logo.png',
      'Kidsbooks logo.png',
      'LKA logo.png',
      'Long and McQuade logo.png',
      'Lynn Valley Meats logo.png',
      'MOXIE logo.png',
      'Maple leaf garden centre logo.png',
      'Moja Coffee logo.jpg',
      'NVRC logo.png',
      'North shore dog walkers logo.jpg',
      'Northlands Golf logo.png',
      'PNE_Pinwheel_Logo_RGB.jpg',
      'Romers logo.png',
      'SCTY stacked logo.png',
      'TUTS logo.png',
      'Tom Lee Music logo.png',
      'Vancouver canadians.png',
      'WellFed logo.png',
      'arts umbrella.png',
      'burhan logo.png',
      'cutie pie wax bar.png',
      'cypress.png',
      'improv centre.png',
      'lights up full logo 400x250.jpg',
      'monova.png',
      'montgomery music.png',
      'nook.png',
      'presentation house theatre.png',
      'sophia nails.png',
      'stongs.png',
      'view optometry.png',
      'zazou_logo.png',
    ];

    function buildGrid() {
      const grid = document.createElement('div');
      grid.className = 'logo-grid';
      // Shuffle for variety
      const shuffled = [...LOGOS].sort(() => Math.random() - 0.5);
      shuffled.forEach(name => {
        const cell = document.createElement('div');
        cell.className = 'logo-cell';
        const img = document.createElement('img');
        img.src = `table_sponsors/${encodeURIComponent(name)}`;
        img.alt = name.replace(/\.[^.]+$/, '');
        img.loading = 'lazy';
        cell.appendChild(img);
        grid.appendChild(cell);
      });
      return grid;
    }

    const track = document.getElementById('track');
    // Two copies for seamless infinite loop
    track.appendChild(buildGrid());
    track.appendChild(buildGrid());
  </script>

</body>
</html>

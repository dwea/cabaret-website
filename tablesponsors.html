  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Raleway:wght@400;600;700;800&family=Cormorant+Garamond:ital,wght@1,400;1,600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0E0509;
      --gold:      #C4963A;
      --gold-lt:   #E2B660;
      --cream:     #F5EDE0;
      --rose-pale: #D4A0A8;
      --muted:     rgba(245,237,224,0.5);
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--cream);
      font-family: 'Raleway', sans-serif;
      overflow: hidden;
    }

    /* ── SCROLLING LOGO WALL ─────────────────────────────────── */
    .scroll-wrap {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    .scroll-track {
      width: 100vw;
      display: flex;
      flex-direction: column;
      gap: 0;
      animation: scroll-up 70s -10s linear infinite;
      will-change: transform;
    }
    .scroll-track:hover { animation-play-state: paused; }

    @keyframes scroll-up {
      0%   { transform: translateY(0); }
      100% { transform: translateY(-50%); }
    }

    .logo-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(clamp(100px, 18vw, 220px), 1fr));
      gap: clamp(10px, 1.5vw, 28px);
      padding: clamp(10px, 1.5vw, 28px);
    }

    .logo-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      background: rgba(255,255,255,0.03);
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.06);
      min-height: clamp(70px, 10vw, 120px);
      box-shadow: 0 0 18px rgba(0,0,0,0.4);
    }

    .logo-cell img {
      max-width: 100%;
      max-height: clamp(50px, 7vw, 90px);
      width: auto;
      height: auto;
      object-fit: contain;
      opacity: 0.92;
      filter:
        drop-shadow(0 0 6px rgba(255,255,255,0.18))
        drop-shadow(0 0 14px rgba(255,255,255,0.08));
    }

    /* ── HEADING OVERLAY ─────────────────────────────────────── */
    .heading-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      padding: 0 clamp(16px, 4vw, 60px);
    }

    /* the frosted frame */
    .heading-frame {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(20px, 3vw, 48px) clamp(28px, 5vw, 80px);
      background: rgba(14, 5, 9, 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(196,150,58,0.35);
      border-radius: 8px;
      max-width: min(700px, 90vw);
      width: 100%;
    }

    .eyebrow {
      font-size: clamp(0.55rem, 1.8vw, 0.82rem);
      font-weight: 800;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0.85;
      margin-bottom: clamp(0.6rem, 1.5vw, 1.1rem);
      text-align: center;
    }

    .main-heading {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(2.8rem, 10vw, 7rem);
      color: var(--cream);
      text-align: center;
      line-height: 1.0;
    }

    /* ornament */
    .orn {
      display: flex;
      align-items: center;
      gap: 1rem;
      width: 100%;
      margin: clamp(0.7rem, 1.5vw, 1.1rem) 0;
    }
    .orn-line {
      flex: 1; height: 1px;
      background: linear-gradient(to right, transparent, var(--gold));
      opacity: 0.55;
    }
    .orn-line.r { background: linear-gradient(to left, transparent, var(--gold)); }
    .orn-gem {
      width: 7px; height: 7px;
      background: var(--gold);
      transform: rotate(45deg);
      opacity: 0.85;
    }

    .sub-heading {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(0.95rem, 3vw, 1.5rem);
      color: var(--muted);
      text-align: center;
    }
  </style>

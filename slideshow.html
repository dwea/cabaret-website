<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Days of Wine &amp; Roses — Slideshow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Raleway:wght@400;600;700;800&family=Cormorant+Garamond:ital,wght@1,400;1,600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0E0509;
      --gold:      #C4963A;
      --gold-lt:   #E2B660;
      --cream:     #F5EDE0;
      --rose-pale: #D4A0A8;
      --muted:     rgba(245,237,224,0.45);
      --border:    rgba(196,150,58,0.25);
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--cream);
      font-family: 'Raleway', sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* ── SLIDE CONTAINER ──────────────────────────────────── */
    #deck {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5vw;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      overflow: hidden;
    }
    .slide.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* ── EVENT WATERMARK (all slides) ───────────────────────── */
    .slide-watermark {
      position: absolute;
      top: 2.2rem;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
    }
    .watermark-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(0.9rem, 1.4vw, 1.2rem);
      color: var(--gold);
      opacity: 0.7;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }
    .watermark-school {
      font-size: clamp(0.55rem, 0.9vw, 0.72rem);
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 0.2rem;
      white-space: nowrap;
    }

    /* ── ORNAMENT LINE ──────────────────────────────────────── */
    .orn {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      width: min(480px, 60vw);
      margin: 0.9rem auto;
    }
    .slide-sponsors .orn { margin: 0.5rem auto; }
    .orn-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold));
      opacity: 0.5;
    }
    .orn-line.r { background: linear-gradient(to left, transparent, var(--gold)); }
    .orn-gem {
      width: 6px; height: 6px;
      background: var(--gold);
      transform: rotate(45deg);
      opacity: 0.8;
    }

    /* ── PERFORMING SLIDE ───────────────────────────────────── */
    .slide-performing .label {
      font-size: clamp(0.65rem, 1.2vw, 0.85rem);
      font-weight: 800;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0.9;
    }
    .slide-performing .group-name {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(2.8rem, 8vw, 6.5rem);
      font-weight: 400;
      color: var(--cream);
      text-align: center;
      line-height: 1.1;
      margin-top: 0.1em;
    }
    .slide-performing .section-tag {
      font-size: clamp(0.7rem, 1.3vw, 0.95rem);
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--rose-pale);
      opacity: 0.75;
      margin-top: 0.6rem;
    }
    .slide-performing .subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(1rem, 2.2vw, 1.5rem);
      color: var(--muted);
      margin-top: 0.5rem;
    }

    /* ── SPONSOR SLIDE ──────────────────────────────────────── */
    .slide-sponsors .thank-label {
      font-size: clamp(0.65rem, 1.1vw, 0.82rem);
      font-weight: 800;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0.85;
    }
    .slide-sponsors .thank-heading {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 400;
      color: var(--cream);
      text-align: center;
      line-height: 1.05;
      margin-top: 0.1em;
      font-size: clamp(1.6rem, 4vw, 3rem);
    }
    .slide-sponsors .treat-table-note {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(2.125rem, 4.5vw, 2.875rem);
      color: var(--gold-lt);
      opacity: 0.9;
      margin: 1.2rem 0 1rem;
      text-align: center;
    }
    .sponsor-grid {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      width: min(960px, 90vw);
      margin-top: 0.2rem;
    }
    .sponsor-tier-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
    }
    .tier-heading {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      width: 100%;
    }
    .tier-heading-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold));
      opacity: 0.3;
    }
    .tier-heading-line.r { background: linear-gradient(to left, transparent, var(--gold)); }
    .tier-heading-label {
      font-size: clamp(0.52rem, 0.9vw, 0.68rem);
      font-weight: 800;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0.7;
      white-space: nowrap;
    }
    .sponsor-tier-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6rem;
    }
    /* text fallback chip (no logo) */
    .sponsor-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1.1rem;
      border-radius: 4px;
      border: 1px solid;
      font-weight: 600;
    }
    .sponsor-chip .chip-name {
      font-family: 'Playfair Display', serif;
      font-style: italic;
    }
    .chip-presenting {
      background: linear-gradient(135deg,
        rgba(170,165,205,0.26) 0%, rgba(248,246,255,0.28) 35%,
        rgba(205,202,235,0.20) 50%, rgba(185,180,220,0.26) 100%);
      border-color: rgba(210,205,245,0.45);
      font-size: clamp(0.8rem, 1.5vw, 1.05rem);
    }
    .chip-gold {
      background: linear-gradient(135deg,
        rgba(140,98,22,0.33) 0%, rgba(242,198,90,0.31) 35%,
        rgba(185,138,45,0.23) 50%, rgba(165,118,35,0.32) 100%);
      border-color: rgba(226,182,96,0.52);
      font-size: clamp(0.75rem, 1.3vw, 0.95rem);
    }
    .chip-silver {
      background: linear-gradient(135deg,
        rgba(115,130,150,0.28) 0%, rgba(222,232,240,0.27) 35%,
        rgba(155,172,188,0.20) 50%, rgba(140,158,175,0.27) 100%);
      border-color: rgba(190,208,222,0.42);
      font-size: clamp(0.7rem, 1.2vw, 0.88rem);
    }
    .chip-other {
      background: rgba(160,105,65,0.22);
      border-color: rgba(160,105,65,0.38);
      font-size: clamp(0.65rem, 1.1vw, 0.82rem);
    }

    /* logo chip — white card to preserve white-bg PNGs */
    .logo-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      border-radius: 6px;
      border: 1px solid;
      padding: 0.55rem 1.1rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.35);
    }
    .logo-chip img {
      display: block;
      object-fit: contain;
      width: auto;
    }
    .logo-chip img { height: clamp(55px, 7.5vh, 88px); }
    .logo-chip.tier-presenting { border-color: rgba(210,205,245,0.5); }
    .logo-chip.tier-gold       { border-color: rgba(196,150,58,0.55); }
    .logo-chip.tier-silver     { border-color: rgba(170,185,200,0.45); }
    .logo-chip.tier-other      { border-color: rgba(160,105,65,0.4); }

    /* ── NAVIGATION HUD ─────────────────────────────────────── */
    #hud {
      position: fixed;
      bottom: 1.6rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 1.4rem;
      background: rgba(14,5,9,0.75);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 0.55rem 1.4rem;
      backdrop-filter: blur(8px);
      z-index: 100;
      transition: opacity 0.4s;
    }
    #hud.hidden { opacity: 0; pointer-events: none; }

    .hud-btn {
      background: none;
      border: none;
      color: var(--gold-lt);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0.1rem 0.3rem;
      transition: color 0.15s;
      line-height: 1;
    }
    .hud-btn:hover { color: var(--cream); }
    .hud-btn:disabled { color: var(--muted); cursor: default; }

    #slide-counter {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--muted);
      min-width: 4em;
      text-align: center;
    }

    .hud-sep {
      width: 1px;
      height: 1rem;
      background: var(--border);
    }

    #fullscreen-btn { font-size: 0.95rem; }

    /* ── HELP OVERLAY ───────────────────────────────────────── */
    #help {
      position: fixed;
      inset: 0;
      background: rgba(14,5,9,0.88);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    #help.visible { opacity: 1; pointer-events: auto; }
    .help-box {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2rem 3rem;
      text-align: center;
      max-width: 360px;
    }
    .help-box h2 {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.4rem;
      color: var(--gold-lt);
      margin-bottom: 1.2rem;
    }
    .help-row {
      display: flex;
      justify-content: space-between;
      gap: 2rem;
      font-size: 0.82rem;
      color: var(--muted);
      margin: 0.45rem 0;
    }
    .help-key {
      font-weight: 700;
      color: var(--cream);
      font-family: monospace;
    }
    .help-close {
      margin-top: 1.4rem;
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── LOADING STATE ──────────────────────────────────────── */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 300;
      background: var(--bg);
      transition: opacity 0.5s;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    .loading-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.8rem;
      color: var(--gold);
    }
    .loading-msg {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }
    /* ── TITLE SLIDE ────────────────────────────────────────── */
    .slide-title {
      overflow: hidden;
      background:
        radial-gradient(ellipse 90% 70% at 15% 85%, rgba(122,45,58,0.6) 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 85% 15%, rgba(196,150,58,0.14) 0%, transparent 50%),
        var(--bg);
    }
    .slide-title::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(196,150,58,0.025) 40px),
        repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(196,150,58,0.025) 40px);
      pointer-events: none;
    }
    .t-spotlight {
      position: absolute; inset: 0;
      pointer-events: none;
      animation: t-spotlight 20s ease-in-out infinite;
    }
    @keyframes t-spotlight {
      0%   { background: radial-gradient(ellipse 40% 60% at 25% 35%, rgba(255,210,110,0.15) 0%, transparent 60%); }
      25%  { background: radial-gradient(ellipse 40% 60% at 75% 25%, rgba(255,210,110,0.11) 0%, transparent 60%); }
      55%  { background: radial-gradient(ellipse 35% 55% at 65% 70%, rgba(200,80,108,0.10) 0%, transparent 60%); }
      80%  { background: radial-gradient(ellipse 40% 60% at 20% 65%, rgba(255,210,110,0.13) 0%, transparent 60%); }
      100% { background: radial-gradient(ellipse 40% 60% at 25% 35%, rgba(255,210,110,0.15) 0%, transparent 60%); }
    }
    .t-rose-bg {
      position: absolute; bottom: -60px; right: -40px;
      width: 320px; height: 320px; pointer-events: none;
      animation: t-rose-breathe 9s ease-in-out infinite;
    }
    .t-rose-bg-2 {
      position: absolute; top: -30px; left: -50px;
      width: 240px; height: 240px; pointer-events: none;
      transform: rotate(35deg) scaleX(-1);
      animation: t-rose-breathe 12s ease-in-out infinite reverse;
    }
    @keyframes t-rose-breathe {
      0%, 100% { opacity: 0.07; }
      50%       { opacity: 0.13; }
    }
    /* petals & sparkles */
    .petal-wrap { position: absolute; top: 0; pointer-events: none; }
    .petal { position: relative; border-radius: 60% 10% 60% 10%; opacity: 0; pointer-events: none; }
    @keyframes petal-sway {
      from { transform: translateX(calc(var(--sway, 30px) * -1)); }
      to   { transform: translateX(var(--sway, 30px)); }
    }
    @keyframes petal-fall {
      0%   { transform: translateY(-20px) rotate(0deg);   opacity: 0; }
      6%   { opacity: 0.45; }
      30%  { transform: translateY(28vh)  rotate(160deg); }
      60%  { transform: translateY(58vh)  rotate(320deg); opacity: 0.28; }
      90%  { opacity: 0.12; }
      100% { transform: translateY(110vh) rotate(500deg); opacity: 0; }
    }
    .t-sparkle {
      position: absolute; pointer-events: none;
      color: var(--gold-lt); line-height: 1; opacity: 0;
      animation: t-twinkle ease-in-out infinite;
    }
    @keyframes t-twinkle {
      0%, 100% { opacity: 0;   transform: scale(0.4); }
      50%       { opacity: 0.7; transform: scale(1); }
    }
    /* title content */
    .t-content {
      position: relative; z-index: 2;
      text-align: center; padding: 2rem 1.5rem; max-width: 560px;
    }
    .t-logo {
      display: block; width: 140px; height: auto;
      margin: 0 auto 1.6rem; opacity: 0.88;
      filter: drop-shadow(0 2px 12px rgba(0,0,0,0.4));
      animation: t-fade 1s ease 0.2s both;
    }
    .t-eyebrow {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.9rem; font-weight: 600;
      letter-spacing: 0.45em; text-transform: uppercase;
      color: var(--gold); margin-bottom: 1.4rem;
      animation: t-rise 0.8s cubic-bezier(0.22,1,0.36,1) 0.5s both;
    }
    .t-title {
      font-family: 'Playfair Display', serif;
      font-style: italic; font-weight: 700;
      font-size: clamp(3.2rem, 10vw, 5.5rem);
      line-height: 1.05; color: transparent;
      background-image: linear-gradient(108deg,
        var(--cream) 0%, var(--cream) 44%,
        rgba(255,253,248,0.92) 47%, #fff 50%,
        rgba(255,253,248,0.92) 53%, var(--cream) 56%, var(--cream) 100%);
      background-size: 300% 100%; background-position: 0% center;
      -webkit-background-clip: text; background-clip: text;
      animation: t-rise 1s cubic-bezier(0.22,1,0.36,1) 0.8s both,
                 t-pulse 6s ease-in-out 2.5s infinite,
                 t-shimmer 10s linear 4s infinite;
    }
    .t-amp { color: var(--gold); -webkit-text-fill-color: var(--gold); font-style: normal; font-weight: 400; }
    .t-divider {
      display: flex; align-items: center; gap: 0.8rem;
      margin: 1.6rem auto; max-width: 220px;
      animation: t-fade 0.6s ease 1.4s both;
    }
    .t-divider-line {
      flex: 1; height: 1px;
      background: linear-gradient(to right, transparent, var(--gold));
      transform-origin: left center;
      animation: t-drawline 0.8s ease 1.5s both;
    }
    .t-divider-line.r {
      background: linear-gradient(to left, transparent, var(--gold));
      transform-origin: right center;
    }
    .t-divider-gem { width: 5px; height: 5px; background: var(--gold); transform: rotate(45deg); flex-shrink: 0; }
    .t-detail {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem; font-style: italic; font-weight: 600;
      color: var(--cream); letter-spacing: 0.04em; line-height: 1.85;
      animation: t-rise 0.7s cubic-bezier(0.22,1,0.36,1) 1.6s both;
    }
    .t-school {
      margin-top: 1.4rem; font-size: 0.82rem; font-weight: 600;
      letter-spacing: 0.35em; text-transform: uppercase;
      color: var(--gold); opacity: 0.85;
      animation: t-rise 0.6s ease 2.1s both;
    }
    @keyframes t-rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes t-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes t-drawline { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes t-pulse {
      0%, 100% { text-shadow: 0 2px 40px rgba(122,45,58,0.25); }
      50%       { text-shadow: 0 2px 40px rgba(122,45,58,0.5), 0 0 80px rgba(196,150,58,0.12); }
    }
    @keyframes t-shimmer {
      0%   { background-position: 0% center; }
      80%  { background-position: 0% center; }
      100% { background-position: 100% center; }
    }
  </style>
</head>
<body>

<div id="loading">
  <div class="loading-title">Days of Wine &amp; Roses</div>
  <div class="loading-msg">Loading programme…</div>
</div>

<div id="deck"></div>

<div id="hud">
  <button class="hud-btn" id="prev-btn" title="Previous (←)" disabled>&#8592;</button>
  <span id="slide-counter">— / —</span>
  <button class="hud-btn" id="next-btn" title="Next (→)">&#8594;</button>
  <div class="hud-sep"></div>
  <button class="hud-btn" id="fullscreen-btn" title="Fullscreen (F)">&#x26F6;</button>
  <button class="hud-btn" id="help-btn" title="Keyboard help (?)">?</button>
</div>

<div id="help">
  <div class="help-box">
    <h2>Keyboard Controls</h2>
    <div class="help-row"><span class="help-key">→ / Space</span><span>Next slide</span></div>
    <div class="help-row"><span class="help-key">←</span><span>Previous slide</span></div>
    <div class="help-row"><span class="help-key">F</span><span>Toggle fullscreen</span></div>
    <div class="help-row"><span class="help-key">H</span><span>Jump to first sponsor slide</span></div>
    <div class="help-row"><span class="help-key">?</span><span>This help screen</span></div>
    <div class="help-close">Press any key to dismiss</div>
  </div>
</div>

<script>
(function () {
  const SHEET_URLS = {
    programme: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vREVKPHPScTE00n1LhNENM8nnQxR5VVhMfHu9aMpJJauVcsW2hxl0c7QOsjBUrI72PhnXk9Q_eT_U-j/pub?gid=0&single=true&output=csv',
    sponsors:  'https://docs.google.com/spreadsheets/d/e/2PACX-1vREVKPHPScTE00n1LhNENM8nnQxR5VVhMfHu9aMpJJauVcsW2hxl0c7QOsjBUrI72PhnXk9Q_eT_U-j/pub?gid=1377307627&single=true&output=csv',
  };

  // ── CSV parser (same as main site) ─────────────────────────
  function parseCSV(text) {
    const rows = [];
    let row = [], field = '', inQ = false;
    const flush = () => { row.push(field.trim()); field = ''; };
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQ) {
        if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
        else if (c === '"') { inQ = false; }
        else { field += c; }
      } else {
        if      (c === '"')  { inQ = true; }
        else if (c === ',')  { flush(); }
        else if (c === '\n' || c === '\r') {
          if (c === '\r' && text[i + 1] === '\n') i++;
          flush();
          if (row.some(f => f)) rows.push(row);
          row = [];
        } else { field += c; }
      }
    }
    flush();
    if (row.some(f => f)) rows.push(row);
    if (!rows.length) return [];
    const headers = rows[0].map(h =>
      h.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '')
    );
    return rows.slice(1)
      .filter(r => r.some(c => c))
      .map(r => Object.fromEntries(headers.map((h, i) => [h, (r[i] ?? '').trim()])));
  }

  // ── Extract ordered groups from programme rows ─────────────
  function extractGroups(rows) {
    const groups = [];
    let cur = null, curSection = '';
    for (const row of rows) {
      const isNewGroup = row.group_name && row.group_name !== (cur && cur.group_name);
      if (isNewGroup) {
        curSection = (row.section || curSection).trim();
        cur = { group_name: row.group_name, subtitle: row.subtitle || '', section: curSection };
        groups.push(cur);
      }
    }
    return groups;
  }

  // ── Logo matching ──────────────────────────────────────────
  const LOGO_FILES = [
    'Aspire.png', 'Canyon EV.png', 'Furry.png', 'Haute Dogz.png',
    'IRA Gordon.png', 'IRA.png', 'Legacy.png', 'Pigott.png',
    'Sotheby_s.png', "Sotheby's.png", 'Stilhavn.png', 'Westview Orth.png',
  ];

  function normStr(s) {
    return s.toLowerCase()
      .replace(/[^a-z0-9]+/g, ' ')
      .replace(/(.)\1+/g, '$1')  // collapse doubled letters: piggott → pigot
      .trim();
  }
  // Returns true if two words share a meaningful prefix (handles "Stilhaven"/"Stilhavn")
  function wordsSimilar(a, b) {
    if (a === b) return true;
    if (a.includes(b) || b.includes(a)) return true;
    const len = Math.min(a.length, b.length);
    if (len >= 5 && a.slice(0, len) === b.slice(0, len)) return true;
    // shared prefix of at least 5 chars
    let shared = 0;
    while (shared < len && a[shared] === b[shared]) shared++;
    return shared >= 5;
  }

  function matchLogo(sponsorName) {
    const normName = normStr(sponsorName);
    const nameWords = normName.split(' ').filter(w => w.length >= 3);
    let bestFile = null, bestScore = 0;
    for (const file of LOGO_FILES) {
      const normFile = normStr(file.replace(/\.png$/i, ''));
      const fileWords = normFile.split(' ').filter(w => w.length >= 3);
      let score = 0;
      for (const fw of fileWords)
        for (const nw of nameWords)
          if (wordsSimilar(fw, nw)) score += fw.length + nw.length;
      if (score > bestScore) { bestScore = score; bestFile = file; }
    }
    return bestScore >= 6 ? bestFile : null;
  }

  // ── Sponsor tier classification ────────────────────────────
  function tierKey(tier) {
    if (/presenting|platinum/i.test(tier)) return 'presenting';
    if (/gold/i.test(tier))                return 'gold';
    if (/silver/i.test(tier))              return 'silver';
    return 'other';
  }
  function tierMedal(tier) {
    if (/presenting|platinum/i.test(tier)) return '🏆';
    if (/gold/i.test(tier))                return '🥇';
    if (/silver/i.test(tier))              return '🥈';
    return '🥉';
  }

  // ── Build sponsor grid HTML ────────────────────────────────
  function buildSponsorGrid(sponsors) {
    const tierOrder = [], tiers = {};
    for (const s of sponsors) {
      const t = s.tier || 'Sponsors';
      if (!tiers[t]) { tiers[t] = []; tierOrder.push(t); }
      tiers[t].push(s);
    }
    return tierOrder.map(tier => {
      const tk = tierKey(tier);
      const medal = tierMedal(tier);
      const chips = tiers[tier].map(s => {
        const logo = matchLogo(s.name);
        if (logo) {
          return `<span class="logo-chip tier-${tk}">
            <img src="logos/${encodeURIComponent(logo)}" alt="${s.name}">
          </span>`;
        }
        return `<span class="logo-chip tier-${tk}" style="padding:0.55rem 1.4rem;">
          <span class="chip-name" style="font-family:'Playfair Display',serif;font-style:italic;color:#1a0b10;font-size:clamp(0.8rem,1.4vw,1rem);font-weight:600;">${s.name}</span>
        </span>`;
      }).join('');
      return `<div class="sponsor-tier-block">
        <div class="tier-heading">
          <div class="tier-heading-line"></div>
          <div class="tier-heading-label">${tier}</div>
          <div class="tier-heading-line r"></div>
        </div>
        <div class="sponsor-tier-row">${chips}</div>
      </div>`;
    }).join('');
  }

  // ── Watermark HTML (shared across slides) ──────────────────
  const watermarkHTML = `
    <div class="slide-watermark">
      <div class="watermark-title">Days of Wine &amp; Roses</div>
      <div class="watermark-school">Argyle Music · Argyle Secondary · 2026</div>
    </div>`;

  const ornHTML = `
    <div class="orn">
      <div class="orn-line"></div>
      <div class="orn-gem"></div>
      <div class="orn-line r"></div>
    </div>`;

  // ── Title slide ────────────────────────────────────────────
  const ROSE_SVG_1 = `<svg class="t-rose-bg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M100 20C70 5 20 25 25 60C30 95 65 105 100 175C135 105 170 95 175 60C180 25 130 5 100 20Z" fill="#C8506C"/>
    <path d="M100 30C80 15 40 30 45 62C50 94 80 104 100 160C120 104 150 94 155 62C160 30 120 15 100 30Z" fill="#9B3D52"/>
    <path d="M100 40C88 28 60 38 63 65C66 92 88 100 100 145C112 100 134 92 137 65C140 38 112 28 100 40Z" fill="#7A2D3A"/>
    <line x1="100" y1="175" x2="100" y2="200" stroke="#4A1D28" stroke-width="3"/>
    <path d="M100 188C90 182 78 185 80 192C82 199 92 196 100 188Z" fill="#4A1D28"/>
  </svg>`;
  const ROSE_SVG_2 = `<svg class="t-rose-bg-2" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M100 20C70 5 20 25 25 60C30 95 65 105 100 175C135 105 170 95 175 60C180 25 130 5 100 20Z" fill="#C4963A"/>
    <path d="M100 40C80 25 45 38 48 65C51 92 80 103 100 155C120 103 149 92 152 65C155 38 120 25 100 40Z" fill="#9B7028"/>
  </svg>`;

  function buildTitleSlide() {
    const div = document.createElement('div');
    div.className = 'slide slide-title';
    div.innerHTML = `
      <div class="t-spotlight"></div>
      ${ROSE_SVG_1}
      ${ROSE_SVG_2}
      <div class="t-content">
        <img class="t-logo" src="ArgyleLogoWhiteBig.png" alt="Argyle Music">
        <p class="t-eyebrow">Jazz Cabaret Evening</p>
        <h1 class="t-title">Days of Wine<br><span class="t-amp">&amp;</span> Roses</h1>
        <div class="t-divider">
          <div class="t-divider-line"></div>
          <div class="t-divider-gem"></div>
          <div class="t-divider-line r"></div>
        </div>
        <p class="t-detail">
          Argyle Secondary · North Vancouver
        </p>
        <p class="t-school">Presented by Argyle Music</p>
      </div>`;
    return div;
  }

  function spawnPetals(el) {
    // clear any petals left from a previous activation
    el.querySelectorAll('.petal-wrap').forEach(w => w.remove());

    let active = true;
    let fadeTimer;

    function spawnPetal(preOffset) {
      const wrap = document.createElement('div');
      wrap.className = 'petal-wrap';
      const inner = document.createElement('div');
      inner.className = 'petal';
      const size = 8 + Math.random() * 11;
      const fallDur = 9 + Math.random() * 7;
      const swayDur = 1.8 + Math.random() * 2.2;
      const swayAmt = 28 + Math.random() * 60;
      const startX  = 3 + Math.random() * 94;
      const swayOff = -(Math.random() * swayDur);
      const hue = 348 + Math.random() * 10;
      const sat = 80 + Math.random() * 18;
      const lit = 52 + Math.random() * 12;
      const offset = preOffset !== undefined ? preOffset : 0;
      wrap.style.cssText = `left:${startX}%;--sway:${swayAmt}px;animation:petal-sway ${swayDur}s ease-in-out ${swayOff}s infinite alternate`;
      inner.style.cssText = `width:${size}px;height:${size * 0.65}px;background:hsl(${hue}deg ${sat}% ${lit}%);animation:petal-fall ${fallDur}s linear ${offset}s forwards`;
      wrap.appendChild(inner);
      el.appendChild(wrap);
      setTimeout(() => {
        wrap.remove();
        if (el.isConnected && active) spawnPetal();
      }, (fallDur + offset) * 1000);
    }

    for (let i = 0; i < 18; i++) spawnPetal(-(Math.random() * 8));

    // Fade out and stop after 15 seconds
    fadeTimer = setTimeout(() => {
      active = false;
      el.querySelectorAll('.petal-wrap').forEach(w => {
        w.style.transition = 'opacity 3s ease';
        w.style.opacity = '0';
      });
    }, 15000);

    // Return a stop function so goTo() can clean up when leaving the slide
    return function stop() {
      active = false;
      clearTimeout(fadeTimer);
      el.querySelectorAll('.petal-wrap').forEach(w => w.remove());
    };
  }

  function initTitleAnimations(el) {
    // sparkles (title slide only — petals handled by goTo)
    const chars = ['✦','✧','·','⋆','✺'];
    function spawnSparkle() {
      const s = document.createElement('span');
      s.className = 't-sparkle';
      s.textContent = chars[Math.floor(Math.random() * chars.length)];
      const dur = 2 + Math.random() * 3, delay = Math.random() * dur;
      s.style.cssText = `left:${5+Math.random()*90}%;top:${5+Math.random()*90}%;animation-duration:${dur}s;animation-delay:${delay}s;font-size:${0.5+Math.random()*0.6}rem`;
      el.appendChild(s);
      setTimeout(() => { s.remove(); if (el.isConnected) spawnSparkle(); }, (dur * 3 + delay) * 1000);
    }
    for (let i = 0; i < 14; i++) setTimeout(spawnSparkle, i * 180);
  }

  // ── Build slide elements ───────────────────────────────────
  function buildSlides(groups, sponsors) {
    const deck = document.getElementById('deck');
    deck.innerHTML = '';
    const slideEls = [];

    function addSlide(html, extraClass) {
      const div = document.createElement('div');
      div.className = 'slide' + (extraClass ? ' ' + extraClass : '');
      div.innerHTML = html;
      deck.appendChild(div);
      slideEls.push(div);
    }

    // Title slide first
    const titleEl = buildTitleSlide();
    deck.appendChild(titleEl);
    slideEls.push(titleEl);
    initTitleAnimations(titleEl);

    const sponsorGridHTML = buildSponsorGrid(sponsors);

    function sponsorSlide() {
      addSlide(`
        <div class="thank-heading">Thank You to our Sponsors</div>
        <div class="treat-table-note">Treat table sponsored by SaveOnFoods Lynn Valley</div>
        <div class="sponsor-grid">
          ${sponsorGridHTML}
          <div class="sponsor-tier-block">
            <div class="tier-heading">
              <div class="tier-heading-line"></div>
              <div class="tier-heading-label">Supporters</div>
              <div class="tier-heading-line r"></div>
            </div>
            <div class="sponsor-tier-row">
              <span class="logo-chip tier-other">
                <img src="logos/Stilhavn.png" alt="Stilhavn">
              </span>
            </div>
          </div>
        </div>
      `, 'slide-sponsors');
    }

    // start with a sponsor slide
    sponsorSlide();

    for (const g of groups) {
      addSlide(`
        ${watermarkHTML}
        <div class="label">Now Performing</div>
        ${ornHTML}
        <div class="group-name">${g.group_name}</div>
      `, 'slide-performing');

      // sponsor slide after each group
      sponsorSlide();
    }

    return slideEls;
  }

  // ── Slideshow controller ───────────────────────────────────
  let slides = [], current = 0;

  let stopCurrentPetals = null;

  function goTo(n) {
    if (n < 0 || n >= slides.length) return;
    if (stopCurrentPetals) { stopCurrentPetals(); stopCurrentPetals = null; }
    slides[current].classList.remove('active');
    current = n;
    slides[current].classList.add('active');
    stopCurrentPetals = spawnPetals(slides[current]);
    document.getElementById('slide-counter').textContent =
      `${current + 1} / ${slides.length}`;
    document.getElementById('prev-btn').disabled = current === 0;
    document.getElementById('next-btn').disabled = current === slides.length - 1;
  }

  function next() { goTo(current + 1); }
  function prev() { goTo(current - 1); }

  // ── HUD auto-hide ──────────────────────────────────────────
  let hudTimer;
  function showHud() {
    const hud = document.getElementById('hud');
    hud.classList.remove('hidden');
    clearTimeout(hudTimer);
    hudTimer = setTimeout(() => hud.classList.add('hidden'), 3000);
  }
  document.addEventListener('mousemove', showHud);
  document.addEventListener('keydown', showHud);

  // ── Keyboard nav ──────────────────────────────────────────
  let helpVisible = false;
  function toggleHelp(show) {
    helpVisible = show ?? !helpVisible;
    document.getElementById('help').classList.toggle('visible', helpVisible);
  }

  document.addEventListener('keydown', e => {
    if (helpVisible) { toggleHelp(false); return; }
    if (e.key === 'ArrowRight' || e.key === ' ')  { e.preventDefault(); next(); }
    if (e.key === 'ArrowLeft')                    { e.preventDefault(); prev(); }
    if (e.key === 'f' || e.key === 'F')           toggleFullscreen();
    if (e.key === 'h' || e.key === 'H')           goTo(0);
    if (e.key === '?')                            toggleHelp(true);
  });

  // ── Button wiring ──────────────────────────────────────────
  document.getElementById('prev-btn').addEventListener('click', prev);
  document.getElementById('next-btn').addEventListener('click', next);
  document.getElementById('help-btn').addEventListener('click', () => toggleHelp(true));
  document.getElementById('help').addEventListener('click', () => toggleHelp(false));

  // ── Fullscreen ────────────────────────────────────────────
  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  }
  document.getElementById('fullscreen-btn').addEventListener('click', toggleFullscreen);

  // ── Click deck to advance ──────────────────────────────────
  document.getElementById('deck').addEventListener('click', next);

  // ── Fetch & init ──────────────────────────────────────────
  async function get(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status);
    return r.text();
  }

  async function init() {
    try {
      const [progText, sponsText] = await Promise.all([
        get(SHEET_URLS.programme),
        get(SHEET_URLS.sponsors),
      ]);
      const groups   = extractGroups(parseCSV(progText));
      const sponsors = parseCSV(sponsText);
      slides = buildSlides(groups, sponsors);
      goTo(0);
      document.getElementById('loading').classList.add('done');
      showHud();
    } catch (err) {
      document.querySelector('#loading .loading-msg').textContent =
        'Could not load data — check your connection.';
      console.error(err);
    }
  }

  init();
})();
</script>

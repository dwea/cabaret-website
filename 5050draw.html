<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>50/50 Draw — Argyle Cabaret</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:         #0E0509;
      --wine:       #7A2D3A;
      --rose:       #C8506C;
      --gold:       #C4963A;
      --gold-light: #E2B660;
      --cream:      #F0DDD0;
      --text:       #E8D0C4;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none; -webkit-user-select: none;
      background: var(--bg);
      color: var(--text);
      font-family: 'Raleway', sans-serif;
    }

    /* ── BG GLOW ── */
    .bg-glow {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 15% 85%, rgba(122,45,58,0.45) 0%, transparent 55%),
        radial-gradient(ellipse 55% 40% at 85% 15%, rgba(196,150,58,0.08) 0%, transparent 50%);
      transition: background 1.2s ease;
    }
    body.revealing .bg-glow {
      background:
        radial-gradient(ellipse 130% 110% at 50% 50%, rgba(200,80,108,0.22) 0%, transparent 58%),
        radial-gradient(ellipse 80% 60% at 15% 85%, rgba(122,45,58,0.35) 0%, transparent 55%);
    }

    /* ── CHASER LIGHTS ── */
    #light-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 1; }

    /* ── CORNERS ── */
    .corner {
      position: fixed;
      width: clamp(56px, 6vmin, 80px); height: clamp(56px, 6vmin, 80px);
      pointer-events: none; z-index: 5; opacity: 0.75;
    }
    .corner.tl { top: 0.5rem; left: 0.5rem; }
    .corner.tr { top: 0.5rem; right: 0.5rem; }
    .corner.bl { bottom: 0.5rem; left: 0.5rem; }
    .corner.br { bottom: 0.5rem; right: 0.5rem; }

    /* ── STAGE ── */
    .stage {
      position: relative; z-index: 2;
      display: flex; flex-direction: column; align-items: center;
      height: 100svh; overflow: hidden;
    }

    /* ── HEADER ── */
    .header {
      flex-shrink: 0;
      padding: clamp(0.7rem, 2.2vh, 1.6rem) 2rem 0;
      text-align: center;
    }
    .title {
      font-family: 'Playfair Display', serif;
      font-style: italic; font-weight: 700;
      font-size: clamp(1.8rem, 5vw, 3.5rem);
      color: transparent;
      background: linear-gradient(125deg, var(--gold) 0%, var(--gold-light) 45%, var(--gold) 100%);
      background-size: 220% 100%;
      -webkit-background-clip: text; background-clip: text;
      animation: shimmer-gold 7s linear infinite;
      letter-spacing: 0.06em;
    }
    @keyframes shimmer-gold {
      from { background-position: 110% center; }
      to   { background-position: -110% center; }
    }
    .subtitle {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: clamp(0.72rem, 1.6vw, 1rem);
      color: rgba(240,221,208,0.58); letter-spacing: 0.14em; margin-top: 0.12em;
    }
    .ticket-count {
      font-size: clamp(0.6rem, 1.2vw, 0.8rem);
      color: rgba(196,150,58,0.62); margin-top: 0.35em;
      letter-spacing: 0.1em; min-height: 1.3em;
    }

    /* ── ARENA ── */
    .arena { position: relative; flex: 1; width: 100%; overflow: hidden; }

    /* ── HOPPER ── */
    .hopper-outer {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      /* responsive: smaller of 64vw or 59vh, capped at 440px */
      width:  clamp(170px, min(64vw, 59vh), 440px);
      height: clamp(170px, min(64vw, 59vh), 440px);
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, rgba(28,10,17,0.97), rgba(7,2,5,0.99));
      border: 2px solid rgba(196,150,58,0.62);
      box-shadow:
        inset 0 5px 25px rgba(0,0,0,0.85),
        inset 0 -3px 10px rgba(100,30,45,0.3),
        0 0 30px rgba(196,150,58,0.10);
      transition: opacity 0.55s ease, box-shadow 0.5s ease;
      z-index: 6;
    }
    body.spinning .hopper-outer {
      box-shadow:
        inset 0 5px 25px rgba(0,0,0,0.85),
        inset 0 -3px 10px rgba(100,30,45,0.3),
        0 0 55px rgba(200,80,108,0.45),
        0 0 100px rgba(196,150,58,0.18);
    }

    /* physics canvas — fills most of hopper interior */
    #hopper-canvas {
      position: absolute;
      inset: 5%; width: 90%; height: 90%;
      border-radius: 50%;
      z-index: 1;
    }

    /* rotating cage wires */
    .hopper-cage {
      position: absolute; inset: 0; width: 100%; height: 100%;
      animation: cage-rotate 11s linear infinite;
      transform-origin: 50% 50%;
      z-index: 2;
    }
    body.spinning .hopper-cage { animation-duration: 1.5s; }
    @keyframes cage-rotate { to { transform: rotate(360deg); } }

    /* static overlay: inner ring, hub, exit markers */
    .hopper-deco {
      position: absolute; inset: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 3;
    }

    /* subtle top-arc highlight */
    .hopper-shine {
      position: absolute;
      top: 8%; left: 15%; width: 70%; height: 30%;
      border-radius: 50%;
      background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.045) 0%, transparent 70%);
      pointer-events: none; z-index: 4;
    }

    /* ── FLYING BALL ── */
    #ball {
      position: absolute;
      border-radius: 50%;
      display: none;
      z-index: 10;
      will-change: width, height, left, top, transform;
      background:
        radial-gradient(circle at 37% 28%, rgba(255,255,255,0.96) 0%, rgba(255,255,255,0) 36%),
        radial-gradient(circle at 60% 68%, rgba(80,15,25,0.07) 0%, transparent 36%),
        radial-gradient(circle at 50% 50%,
          #FEFCF6 0%, #F6EDD8 25%, #EDD8A8 50%, #D4A845 72%, #A87820 90%, #8A6010 100%);
      box-shadow:
        inset -5px -6px 18px rgba(0,0,0,0.38),
        inset 3px 4px 12px rgba(255,255,255,0.32),
        0 5px 24px rgba(0,0,0,0.65);
      transition: box-shadow 0.5s ease;
    }
    #ball.glowing {
      box-shadow:
        inset -5px -6px 18px rgba(0,0,0,0.38),
        inset 3px 4px 12px rgba(255,255,255,0.32),
        0 8px 40px rgba(0,0,0,0.7),
        0 0 70px rgba(196,150,58,0.65),
        0 0 130px rgba(200,80,108,0.32);
    }
    #ball::before {
      content: '';
      position: absolute; inset: 0; border-radius: 50%;
      background: linear-gradient(to bottom,
        transparent 37%, rgba(160,45,60,0.22) 44%,
        rgba(160,45,60,0.32) 50%, rgba(160,45,60,0.22) 56%, transparent 63%);
    }

    /* text on ball */
    .ball-text {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      border-radius: 50%; overflow: hidden;
      padding: 13%; gap: 0.08em;
      opacity: 0; transition: opacity 0.65s ease 0.1s;
    }
    .ball-text.visible { opacity: 1; }
    .ball-text::before {
      content: '';
      position: absolute; inset: 10%; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,252,242,0.52) 0%, transparent 72%);
      pointer-events: none;
    }
    .ticket-num {
      font-family: 'Playfair Display', serif;
      font-style: italic; font-weight: 700;
      color: #6A1520; line-height: 1;
      letter-spacing: -0.02em;
      text-shadow: 0 1px 4px rgba(255,245,230,0.4);
      position: relative;
    }
    .winner-name {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-weight: 600;
      color: #4A0E18; line-height: 1.2;
      text-align: center; max-width: 86%;
      position: relative;
      text-shadow: 0 1px 3px rgba(255,245,230,0.3);
    }

    /* ── EMPTY STATE ── */
    .empty-state {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 0.8rem; text-align: center; padding: 2rem;
      pointer-events: none;
    }
    .empty-state h2 {
      font-family: 'Playfair Display', serif; font-style: italic;
      color: var(--cream); font-size: clamp(1.2rem, 3vw, 1.8rem); opacity: 0.45;
    }
    .empty-state p {
      color: rgba(240,221,208,0.32);
      font-size: clamp(0.75rem, 1.4vw, 0.9rem); max-width: 360px; line-height: 1.6;
    }

    /* ── CONTROLS ── */
    .controls {
      flex-shrink: 0;
      display: flex; flex-direction: column; align-items: center;
      gap: 0.6rem;
      padding: clamp(0.5rem, 1.3vh, 1rem) 2rem clamp(0.7rem, 2vh, 1.6rem);
      z-index: 3;
    }
    .status-msg {
      font-size: clamp(0.6rem, 1.2vw, 0.78rem);
      color: rgba(196,150,58,0.6); letter-spacing: 0.06em;
      min-height: 1.2em; text-align: center;
    }
    .btn-row { display: flex; gap: 0.7rem; align-items: center; flex-wrap: wrap; justify-content: center; }

    .draw-btn {
      font-family: 'Raleway', sans-serif; font-weight: 600;
      font-size: clamp(0.9rem, 2vw, 1.2rem); letter-spacing: 0.22em;
      padding: 0.72em 2.6em; border: none; border-radius: 3px; cursor: pointer;
      background: linear-gradient(135deg, var(--wine) 0%, var(--rose) 100%);
      color: var(--cream);
      box-shadow: 0 4px 22px rgba(200,80,108,0.4), inset 0 1px 0 rgba(255,255,255,0.12);
      transition: all 0.22s ease; position: relative; overflow: hidden;
    }
    .draw-btn::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, transparent 30%, rgba(255,255,255,0.07) 100%);
    }
    .draw-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(200,80,108,0.55), inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .draw-btn:active:not(:disabled) { transform: translateY(0); }
    .draw-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    @keyframes btn-pulse {
      0%, 100% { box-shadow: 0 4px 22px rgba(200,80,108,0.4), inset 0 1px 0 rgba(255,255,255,0.12); }
      50%       { box-shadow: 0 4px 40px rgba(200,80,108,0.72), inset 0 1px 0 rgba(255,255,255,0.12); }
    }
    .draw-btn.pulse { animation: btn-pulse 2.2s ease-in-out infinite; }

    .ghost-btn {
      font-family: 'Raleway', sans-serif; font-weight: 400;
      font-size: clamp(0.62rem, 1.2vw, 0.8rem); letter-spacing: 0.13em;
      padding: 0.48em 1.25em; border-radius: 3px; cursor: pointer;
      background: transparent; transition: all 0.2s ease;
    }
    .ghost-btn.gold { border: 1px solid rgba(196,150,58,0.35); color: rgba(196,150,58,0.75); }
    .ghost-btn.gold:hover { background: rgba(196,150,58,0.1); border-color: rgba(196,150,58,0.6); color: var(--gold-light); }
    .ghost-btn.rose { border: 1px solid rgba(200,80,108,0.3); color: rgba(200,80,108,0.7); }
    .ghost-btn.rose:hover { background: rgba(200,80,108,0.1); border-color: rgba(200,80,108,0.55); color: var(--rose); }
    #csv-input { display: none; }

    /* ── WINNERS PANEL ── */
    .winners-panel {
      max-height: 7vh; overflow-y: auto; text-align: center;
      scrollbar-width: thin; scrollbar-color: rgba(196,150,58,0.2) transparent;
    }
    .winners-label {
      font-size: clamp(0.52rem, 1vw, 0.68rem); letter-spacing: 0.18em;
      color: rgba(196,150,58,0.5); text-transform: uppercase; margin-bottom: 0.3em;
    }
    .winners-list { display: flex; flex-wrap: wrap; gap: 0.32rem; justify-content: center; }
    .winner-chip {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: clamp(0.68rem, 1.25vw, 0.85rem);
      color: rgba(240,221,208,0.55); padding: 0.16em 0.6em;
      border: 1px solid rgba(200,80,108,0.2); border-radius: 2px;
      background: rgba(200,80,108,0.05); white-space: nowrap;
    }

    /* ── CONFETTI ── */
    .confetti-piece {
      position: fixed; border-radius: 2px; pointer-events: none; z-index: 20;
      animation: confetti-fall linear forwards;
    }
    @keyframes confetti-fall {
      0%   { transform: translate(0,0) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(0.4); opacity: 0; }
    }
  </style>
</head>
<body>

<div class="bg-glow"></div>
<canvas id="light-canvas"></canvas>

<!-- Art-deco corners -->
<svg class="corner tl" viewBox="0 0 90 90" fill="none" aria-hidden="true">
  <polyline points="4,66 4,4 66,4" stroke="rgba(196,150,58,0.88)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="4" y1="66" x2="11" y2="66" stroke="rgba(196,150,58,0.88)" stroke-width="1.5" stroke-linecap="round"/>

  <circle cx="4" cy="66" r="1.8" fill="rgba(196,150,58,0.7)"/>
  <circle cx="66" cy="4" r="1.8" fill="rgba(196,150,58,0.7)"/>
</svg>
<svg class="corner tr" viewBox="0 0 90 90" fill="none" aria-hidden="true">
  <g transform="translate(90,0) scale(-1,1)">
    <polyline points="4,66 4,4 66,4" stroke="rgba(196,150,58,0.88)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="4" y1="66" x2="11" y2="66" stroke="rgba(196,150,58,0.88)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="66" y1="4" x2="66" y2="11" stroke="rgba(196,150,58,0.88)" stroke-width="1.5" stroke-linecap="round"/>
    <polyline points="11,58 11,11 58,11" stroke="rgba(196,150,58,0.55)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M4,0.5 L7.5,4 L4,7.5 L0.5,4 Z" stroke="rgba(196,150,58,0.9)" stroke-width="1" fill="rgba(196,150,58,0.3)"/>
    <path d="M22,4 A18,18 0 0,0 4,22" stroke="rgba(196,150,58,0.45)" stroke-width="0.75" fill="none"/>
    <path d="M36,4 A32,32 0 0,0 4,36" stroke="rgba(196,150,58,0.28)" stroke-width="0.5" stroke-dasharray="2 3" fill="none"/>
    <circle cx="4" cy="66" r="1.8" fill="rgba(196,150,58,0.7)"/>
    <circle cx="66" cy="4" r="1.8" fill="rgba(196,150,58,0.7)"/>
  </g>
</svg>
<svg class="corner bl" viewBox="0 0 90 90" fill="none" aria-hidden="true">
  <g transform="translate(0,90) scale(1,-1)">
    <polyline points="4,66 4,4 66,4" stroke="rgba(196,150,58,0.88)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="4" y1="66" x2="11" y2="66" stroke="rgba(196,150,58,0.88)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="66" y1="4" x2="66" y2="11" stroke="rgba(196,150,58,0.88)" stroke-width="1.5" stroke-linecap="round"/>
    <polyline points="11,58 11,11 58,11" stroke="rgba(196,150,58,0.55)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M4,0.5 L7.5,4 L4,7.5 L0.5,4 Z" stroke="rgba(196,150,58,0.9)" stroke-width="1" fill="rgba(196,150,58,0.3)"/>
    <path d="M22,4 A18,18 0 0,0 4,22" stroke="rgba(196,150,58,0.45)" stroke-width="0.75" fill="none"/>
    <path d="M36,4 A32,32 0 0,0 4,36" stroke="rgba(196,150,58,0.28)" stroke-width="0.5" stroke-dasharray="2 3" fill="none"/>
    <circle cx="4" cy="66" r="1.8" fill="rgba(196,150,58,0.7)"/>
    <circle cx="66" cy="4" r="1.8" fill="rgba(196,150,58,0.7)"/>
  </g>
</svg>
<svg class="corner br" viewBox="0 0 90 90" fill="none" aria-hidden="true">
  <g transform="translate(90,90) scale(-1,-1)">
    <polyline points="4,66 4,4 66,4" stroke="rgba(196,150,58,0.88)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="4" y1="66" x2="11" y2="66" stroke="rgba(196,150,58,0.88)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="66" y1="4" x2="66" y2="11" stroke="rgba(196,150,58,0.88)" stroke-width="1.5" stroke-linecap="round"/>
    <polyline points="11,58 11,11 58,11" stroke="rgba(196,150,58,0.55)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="66" cy="4" r="1.8" fill="rgba(196,150,58,0.7)"/>
  </g>
</svg>

<main class="stage">

  <header class="header">
    <h1 class="title">50/50 Draw</h1>
    <p class="subtitle">Days of Wine &amp; Roses — Argyle Cabaret</p>
    <p class="ticket-count" id="ticket-count"></p>
  </header>

  <div class="arena" id="arena">

    <!-- Lottery hopper -->
    <div class="hopper-outer" id="hopper-outer">
      <!-- Ball physics canvas -->
      <canvas id="hopper-canvas"></canvas>

      <!-- Rotating cage wires (SVG, animated by CSS) -->
      <svg class="hopper-cage" viewBox="-105 -105 210 210" fill="none" aria-hidden="true">
        <circle r="97"  stroke="rgba(196,150,58,0.16)" stroke-width="0.8"/>
        <!-- main cross wires -->
        <line x1="-97" y1="0"   x2="97"  y2="0"   stroke="rgba(196,150,58,0.20)" stroke-width="0.9"/>
        <line x1="0"   y1="-97" x2="0"   y2="97"  stroke="rgba(196,150,58,0.20)" stroke-width="0.9"/>
        <line x1="-69" y1="-69" x2="69"  y2="69"  stroke="rgba(196,150,58,0.16)" stroke-width="0.75"/>
        <line x1="69"  y1="-69" x2="-69" y2="69"  stroke="rgba(196,150,58,0.16)" stroke-width="0.75"/>
        <!-- secondary wires -->
        <line x1="-37" y1="-91" x2="37"  y2="91"  stroke="rgba(196,150,58,0.10)" stroke-width="0.6"/>
        <line x1="91"  y1="-37" x2="-91" y2="37"  stroke="rgba(196,150,58,0.10)" stroke-width="0.6"/>
        <line x1="37"  y1="-91" x2="-37" y2="91"  stroke="rgba(196,150,58,0.10)" stroke-width="0.6"/>
        <line x1="-91" y1="-37" x2="91"  y2="37"  stroke="rgba(196,150,58,0.10)" stroke-width="0.6"/>
      </svg>

      <!-- Static decoration overlay: rings, hub, exit mouth -->
      <svg class="hopper-deco" viewBox="-105 -105 210 210" fill="none" aria-hidden="true">
        <!-- inner guide ring -->
        <circle r="90" stroke="rgba(196,150,58,0.18)" stroke-width="0.6" stroke-dasharray="2 6"/>
        <!-- hub -->
        <circle r="7"   fill="rgba(196,150,58,0.18)" stroke="rgba(196,150,58,0.45)" stroke-width="1.2"/>
        <circle r="2.8" fill="rgba(196,150,58,0.6)"/>
        <!-- exit mouth at bottom: two inward-angled tabs -->
        <line x1="-19" y1="98"  x2="-28" y2="108" stroke="rgba(196,150,58,0.6)" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="19"  y1="98"  x2="28"  y2="108" stroke="rgba(196,150,58,0.6)" stroke-width="1.5" stroke-linecap="round"/>
        <!-- top arc highlight -->
        <path d="M -95,-15 A 97,97 0 0,1 95,-15" stroke="rgba(255,255,255,0.04)" stroke-width="3" fill="none"/>
      </svg>

      <!-- Top-arc shine -->
      <div class="hopper-shine"></div>
    </div>

    <!-- Flying ball (hidden until draw) -->
    <div id="ball">
      <div class="ball-text" id="ball-text">
        <span class="ticket-num"  id="ticket-num">—</span>
        <span class="winner-name" id="winner-name">—</span>
      </div>
    </div>

    <!-- Empty state -->
    <div class="empty-state" id="empty-state">
      <h2>Ready to Draw</h2>
      <p>Load the ticket CSV file to begin.<br>Winners are remembered between draws.</p>
    </div>

  </div>

  <div class="controls">
    <div class="status-msg" id="status-msg"></div>
    <div class="btn-row">
      <button class="draw-btn" id="draw-btn" disabled>DRAW</button>
    </div>
    <div class="btn-row">
      <button class="ghost-btn gold" id="load-btn">Load Tickets CSV</button>
      <input type="file" id="csv-input" accept=".csv,.txt">
      <button class="ghost-btn rose" id="reset-btn">Reset Winners</button>
    </div>
    <div class="winners-panel" id="winners-panel" style="display:none">
      <div class="winners-label">Previous Winners</div>
      <div class="winners-list" id="winners-list"></div>
    </div>
  </div>

</main>

<script>
/* ── CONFIG ──────────────────────────────────────────────────────── */
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRC390xyd6jyjDUDt3x4SKU54oPdDkqrMFSsa06WAflJtyFECOQ3WYbVTyqC3ukYWyyrKQfX7fSz_3q/pub?output=csv';
const COL_BUYER  = 1;
const COL_TICKET = 3;

/* ── STATE ── */
let tickets      = [];
let winners      = JSON.parse(localStorage.getItem('draw5050_winners') || '[]');
let animating    = false;
let gravSpeed    = 1;      // physics spin speed multiplier
let ejectedId    = -1;     // id of physics ball currently hidden for eject

/* ── HELPERS ── */
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ── CSV ── */
function parseCSV(text) {
  const rows = [];
  let i = 0, len = text.length;
  while (i < len) {
    const row = [];
    while (i < len && text[i] !== '\n' && text[i] !== '\r') {
      if (text[i] === '"') {
        i++;
        let f = '';
        while (i < len) {
          if (text[i] === '"' && text[i+1] === '"') { f += '"'; i += 2; }
          else if (text[i] === '"') { i++; break; }
          else { f += text[i++]; }
        }
        row.push(f);
        if (text[i] === ',') i++;
      } else {
        let f = '';
        while (i < len && text[i] !== ',' && text[i] !== '\n' && text[i] !== '\r') f += text[i++];
        row.push(f.trim());
        if (text[i] === ',') i++;
      }
    }
    if (text[i] === '\r') i++;
    if (text[i] === '\n') i++;
    if (row.length > 1 || (row[0]||'').length) rows.push(row);
  }
  return rows;
}

function loadFromCSV(text) {
  const rows = parseCSV(text);
  if (rows.length < 2) { setStatus('No data found in file.'); return; }
  tickets = rows.slice(1)
    .map(r => ({ name: (r[COL_BUYER]||'').trim(), ticket: (r[COL_TICKET]||'').trim() }))
    .filter(t => t.name && t.ticket);
  if (!tickets.length) { setStatus('Could not find ticket data — check column order.'); return; }
  document.getElementById('empty-state').style.display = 'none';
  updateUI();
  setStatus(`${tickets.length} tickets loaded — ${getEligible().length} eligible.`);
}

async function tryLoadFromURL() {
  if (!SHEET_URL) return;
  try {
    const r = await fetch(SHEET_URL + (SHEET_URL.includes('?') ? '&' : '?') + '_t=' + Date.now());
    loadFromCSV(await r.text());
  } catch(e) { console.warn('Sheet fetch failed:', e); }
}

/* ── ELIGIBLE ── */
function getEligible() {
  const wonNames = new Set(winners.map(w => w.name.toLowerCase().trim()));
  return tickets.filter(t => !wonNames.has(t.name.toLowerCase().trim()));
}

/* ── UI ── */
function updateUI() {
  const eligible = getEligible();
  const countEl  = document.getElementById('ticket-count');
  const drawBtn  = document.getElementById('draw-btn');
  if (tickets.length) {
    countEl.textContent = `${eligible.length} eligible ticket${eligible.length !== 1 ? 's' : ''} · ${tickets.length} total`;
    drawBtn.disabled    = animating || eligible.length === 0;
    drawBtn.textContent = eligible.length === 0 ? 'NO TICKETS LEFT' : (winners.length > 0 ? 'DRAW AGAIN' : 'DRAW');
    drawBtn.classList.toggle('pulse', !animating && eligible.length > 0 && winners.length === 0);
  } else {
    countEl.textContent = '';
    drawBtn.disabled    = true;
    drawBtn.classList.remove('pulse');
  }
  renderWinners();
}
function setStatus(msg) { document.getElementById('status-msg').textContent = msg; }
function renderWinners() {
  const list = document.getElementById('winners-list');
  const panel = document.getElementById('winners-panel');
  list.innerHTML = '';
  if (!winners.length) { panel.style.display = 'none'; return; }
  panel.style.display = '';
  winners.forEach(w => {
    const chip = document.createElement('span');
    chip.className = 'winner-chip';
    chip.textContent = `#${w.ticket} — ${w.name}`;
    list.appendChild(chip);
  });
}
function recordWinner(w) {
  winners.push({ name: w.name, ticket: w.ticket, ts: Date.now() });
  localStorage.setItem('draw5050_winners', JSON.stringify(winners));
}

/* ═══════════════════════════════════════════════════════════════════
   HOPPER PHYSICS
   Gravity rotates over time (simulates spinning drum). Ball-ball and
   ball-wall collisions keep everything tumbling.
═══════════════════════════════════════════════════════════════════ */
const BALL_COLORS = [
  '#F5EDD8','#EDDFB5','#E8D4A0',   // cream variants
  '#D4A830','#C89020','#DCBA50',   // gold variants
  '#C05070','#A84260','#B84868',   // rose variants
  '#EDD8C0','#E0CCA0',             // warm cream
];

let physBalls = [];
let physR     = 0;   // hopper radius in canvas pixels
let hopCtx;

function darken(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, ((n>>16)&0xff) - (amt*255|0));
  const g = Math.max(0, ((n>>8) &0xff) - (amt*255|0));
  const b = Math.max(0, (n      &0xff) - (amt*255|0));
  return `rgb(${r},${g},${b})`;
}

function initPhysics() {
  const canvas = document.getElementById('hopper-canvas');
  hopCtx = canvas.getContext('2d');
  canvas.width  = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;

  const size = canvas.width;
  physR = size * 0.44;
  const ballR = physR * 0.15;

  physBalls = [];
  for (let i = 0; i < 20; i++) {
    const angle = (i / 20) * Math.PI * 2;
    const r = physR * (0.12 + Math.random() * 0.52);
    physBalls.push({
      id: i,
      x: r * Math.cos(angle),
      y: r * Math.sin(angle),
      vx: (Math.random() - 0.5) * 2.5,
      vy: (Math.random() - 0.5) * 2.5,
      r: ballR,
      color: BALL_COLORS[i % BALL_COLORS.length],
      active: true,
    });
  }
}

function stepPhysics() {
  const friction    = 0.990;
  const restitution = 0.65;

  // Gravity is always fixed downward — doesn't rotate with the drum.
  // The drum wall imparts a clockwise tangential push (matching the CSS
  // cage animation), strongest at the wall. This carries balls up the
  // sides; gravity beats the drag near the top so they tumble back down.
  const gravity   = 0.22;
  const drumPush  = 0.018 * gravSpeed; // scales with spin speed

  for (const b of physBalls) {
    if (!b.active) continue;

    // Apply gravity
    b.vy += gravity;

    // Drum-wall drag: clockwise tangential impulse, proportional to
    // how close the ball is to the wall (negligible near centre).
    const d = Math.sqrt(b.x * b.x + b.y * b.y);
    if (d > 1) {
      const nx = b.x / d, ny = b.y / d;
      const tx = -ny, ty = nx;              // clockwise tangential
      const radFrac = d / physR;            // 0 = centre, 1 = wall
      b.vx += tx * drumPush * radFrac;
      b.vy += ty * drumPush * radFrac;
    }

    b.vx *= friction;
    b.vy *= friction;
    b.x  += b.vx;
    b.y  += b.vy;

    // Circular wall collision
    const d2   = Math.sqrt(b.x * b.x + b.y * b.y);
    const maxD = physR - b.r;
    if (d2 > maxD) {
      const nx  = b.x / d2, ny = b.y / d2;
      const dot = b.vx * nx + b.vy * ny;
      if (dot > 0) {
        b.vx = (b.vx - 2 * dot * nx) * restitution;
        b.vy = (b.vy - 2 * dot * ny) * restitution;
      }
      b.x = nx * maxD * 0.997;
      b.y = ny * maxD * 0.997;
    }
  }

  // Ball-ball collisions (20 balls = 190 pairs, very cheap)
  const active = physBalls.filter(b => b.active);
  for (let i = 0; i < active.length; i++) {
    for (let j = i + 1; j < active.length; j++) {
      const a = active[i], b = active[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const dd = dx * dx + dy * dy;
      const minD = a.r + b.r;
      if (dd < minD * minD && dd > 0.001) {
        const dist = Math.sqrt(dd);
        const nx = dx / dist, ny = dy / dist;
        const ov = (minD - dist) * 0.5;
        a.x -= nx * ov; a.y -= ny * ov;
        b.x += nx * ov; b.y += ny * ov;
        const dv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (dv < 0) {
          const imp = dv * 0.6;
          a.vx += imp * nx; a.vy += imp * ny;
          b.vx -= imp * nx; b.vy -= imp * ny;
        }
      }
    }
  }
}

function drawPhysics() {
  const canvas = document.getElementById('hopper-canvas');
  if (!canvas || !hopCtx) return;
  const cw = canvas.width, ch = canvas.height;
  const cx = cw/2, cy = ch/2;
  hopCtx.clearRect(0, 0, cw, ch);
  hopCtx.save();
  hopCtx.beginPath();
  hopCtx.arc(cx, cy, physR, 0, Math.PI*2);
  hopCtx.clip();

  for (const b of physBalls) {
    if (!b.active) continue;
    const bx = cx + b.x, by = cy + b.y;
    const grad = hopCtx.createRadialGradient(
      bx - b.r*0.3, by - b.r*0.35, b.r*0.05,
      bx, by, b.r
    );
    grad.addColorStop(0, 'rgba(255,255,255,0.92)');
    grad.addColorStop(0.28, b.color);
    grad.addColorStop(1, darken(b.color, 0.35));
    hopCtx.beginPath();
    hopCtx.arc(bx, by, b.r, 0, Math.PI*2);
    hopCtx.fillStyle = grad;
    hopCtx.fill();
    hopCtx.strokeStyle = 'rgba(0,0,0,0.14)';
    hopCtx.lineWidth = 0.7;
    hopCtx.stroke();
  }
  hopCtx.restore();
}

function physicsLoop() {
  stepPhysics();
  drawPhysics();
  requestAnimationFrame(physicsLoop);
}

/* ═══════════════════════════════════════════════════════════════════
   DRAW ANIMATION
═══════════════════════════════════════════════════════════════════ */
async function draw() {
  if (animating) return;
  const eligible = getEligible();
  if (!eligible.length) return;

  animating = true;
  updateUI();

  const winner      = eligible[Math.floor(Math.random() * eligible.length)];
  const ballEl      = document.getElementById('ball');
  const hopperOuter = document.getElementById('hopper-outer');

  /* dismiss previous winner if still showing */
  if (ballEl.style.display === 'block') {
    ballEl.style.transition  = 'opacity 0.22s ease';
    ballEl.style.opacity     = '0';
    hopperOuter.style.transition = 'opacity 0.3s ease, box-shadow 0.5s ease';
    hopperOuter.style.opacity    = '1';
    document.body.classList.remove('revealing');
    await sleep(300);
    ballEl.style.display    = 'none';
    ballEl.style.opacity    = '';
    ballEl.style.transition = '';
    /* restore the previously ejected physics ball */
    if (ejectedId >= 0) {
      const eb = physBalls.find(b => b.id === ejectedId);
      if (eb) { eb.active = true; eb.vx = (Math.random()-0.5)*3; eb.vy = -3.5; }
      ejectedId = -1;
    }
  }

  /* spin up */
  document.body.classList.add('spinning');
  gravSpeed = 1;
  const spinInterval = setInterval(() => { gravSpeed = Math.min(gravSpeed * 1.18, 5.5); }, 75);
  await sleep(1150);
  clearInterval(spinInterval);

  /* pick the physics ball closest to the canvas bottom (highest y) */
  const hopperCanvas = document.getElementById('hopper-canvas');
  const arena        = document.getElementById('arena');
  const canvasRect   = hopperCanvas.getBoundingClientRect();
  const arenaRect    = arena.getBoundingClientRect();
  const scaleX       = canvasRect.width  / hopperCanvas.width;
  const scaleY       = canvasRect.height / hopperCanvas.height;
  const cx           = hopperCanvas.width  / 2;
  const cy           = hopperCanvas.height / 2;

  const active = physBalls.filter(b => b.active);
  const chosen = active.reduce((best, b) => b.y > best.y ? b : best, active[0]);
  chosen.active = false;
  ejectedId = chosen.id;

  /* screen position of that ball → arena-relative start for CSS ball */
  const ballScreenX = canvasRect.left + (cx + chosen.x) * scaleX;
  const ballScreenY = canvasRect.top  + (cy + chosen.y) * scaleY;
  const startAX = ballScreenX - arenaRect.left;
  const startAY = ballScreenY - arenaRect.top;
  const initDiam = chosen.r * 2 * scaleX;

  /* fade hopper out */
  hopperOuter.style.transition = 'opacity 0.48s ease, box-shadow 0.5s ease';
  hopperOuter.style.opacity    = '0';
  await sleep(120);

  /* zoom ball toward viewer */
  await animateBallZoom(winner, startAX, startAY, initDiam, arena);

  /* wrap up */
  recordWinner(winner);
  animating = false;
  gravSpeed = 1;
  document.body.classList.remove('spinning');
  updateUI();
}

function animateBallZoom(winner, startAX, startAY, initDiam, arena) {
  return new Promise(resolve => {
    const ballEl   = document.getElementById('ball');
    const ballText = document.getElementById('ball-text');
    document.getElementById('ticket-num').textContent  = '#' + winner.ticket;
    document.getElementById('winner-name').textContent = winner.name;
    ballText.classList.remove('visible');
    ballEl.classList.remove('glowing');

    const aW     = arena.offsetWidth;
    const aH     = arena.offsetHeight;
    const BIG    = Math.min(aW, aH) * 0.80;
    const finalX = aW/2 - BIG/2;
    const finalY = aH/2 - BIG/2;
    const sX     = startAX - initDiam/2;
    const sY     = startAY - initDiam/2;

    let rot = 0;
    ballEl.style.cssText = `
      display: block; opacity: 1; transition: none;
      width: ${initDiam}px; height: ${initDiam}px;
      left: ${sX}px; top: ${sY}px;
      transform: rotate(0deg);
    `;

    const dur = 1100;
    let t0 = null;

    function frame(ts) {
      if (!t0) t0 = ts;
      const t = Math.min((ts - t0) / dur, 1);
      /* ease-in-out (smooth-step) for natural zoom */
      const s = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;

      const size = initDiam + (BIG - initDiam) * s;
      rot = t * 460;  /* ~1.3 rotations during zoom */

      ballEl.style.width     = size + 'px';
      ballEl.style.height    = size + 'px';
      ballEl.style.left      = (sX + (finalX - sX) * s) + 'px';
      ballEl.style.top       = (sY + (finalY - sY) * s) + 'px';
      ballEl.style.transform = `rotate(${rot}deg)`;

      /* keep text font proportional (text hidden, so this is pre-sizing) */
      const fs = size * 0.17;
      document.getElementById('ticket-num').style.fontSize  = fs + 'px';
      document.getElementById('winner-name').style.fontSize = (fs * 0.44) + 'px';

      if (t < 1) { requestAnimationFrame(frame); return; }

      /* ── settle rotation to within ±10° of horizontal ── */
      /* normalise accumulated rotation to [-180, 180] */
      const norm = ((rot % 360) + 360) % 360;
      const near = norm > 180 ? norm - 360 : norm;
      /* snap to nearest 0° (full rotation) plus a small random tilt */
      const tilt      = (Math.random() * 18 - 9);   /* ±9° */
      const targetRot = rot - near + tilt;

      ballEl.style.transition = 'transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1)';
      ballEl.style.transform  = `rotate(${targetRot}deg)`;

      /* reveal text after rotation settles */
      setTimeout(() => {
        ballEl.classList.add('glowing');
        document.body.classList.add('revealing');
        ballText.classList.add('visible');
        spawnConfetti();
        setTimeout(resolve, 700);
      }, 460);
    }
    requestAnimationFrame(frame);
  });
}

/* ── CONFETTI ── */
function spawnConfetti() {
  const colors = ['#C8506C','#C4963A','#E2B660','#F0DDD0','#9B3D52','#7A2D3A'];
  const cx = window.innerWidth/2, cy = window.innerHeight/2;
  for (let i = 0; i < 55; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    const w = 4 + Math.random()*7, h = 8 + Math.random()*12;
    el.style.cssText = `
      left:${cx}px; top:${cy}px; width:${w}px; height:${h}px;
      background:${colors[i%colors.length]};
      --dx:${(Math.random()-0.5)*window.innerWidth*1.3}px;
      --dy:${Math.random()*window.innerHeight*0.85+window.innerHeight*0.15}px;
      --rot:${(Math.random()-0.5)*720}deg;
      animation-duration:${0.7+Math.random()*1.1}s;
      animation-delay:${Math.random()*0.18}s;
    `;
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
}

/* ── EVENTS ── */
document.getElementById('draw-btn').addEventListener('click', draw);

document.getElementById('load-btn').addEventListener('click', () =>
  document.getElementById('csv-input').click()
);
document.getElementById('csv-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => loadFromCSV(ev.target.result);
  reader.readAsText(file);
  e.target.value = '';
});

document.getElementById('reset-btn').addEventListener('click', () => {
  if (!confirm('Clear all previous winners and start fresh?')) return;
  winners = [];
  localStorage.removeItem('draw5050_winners');
  const ballEl = document.getElementById('ball');
  const hopperOuter = document.getElementById('hopper-outer');
  ballEl.style.display = 'none';
  hopperOuter.style.transition = 'opacity 0.4s ease, box-shadow 0.5s ease';
  hopperOuter.style.opacity = '1';
  document.body.classList.remove('revealing', 'spinning');
  /* restore ejected ball */
  if (ejectedId >= 0) {
    const eb = physBalls.find(b => b.id === ejectedId);
    if (eb) { eb.active = true; eb.vx = 0; eb.vy = -2; }
    ejectedId = -1;
  }
  gravSpeed = 1;
  updateUI();
  setStatus('Winners cleared.');
});

/* ── CHASER LIGHTS (identical to 5050.html) ── */
const canvas   = document.getElementById('light-canvas');
const ctx      = canvas.getContext('2d');
const MARGIN   = 26, SPACING = 30, R_OFF = 4, R_ON = 5, WAVES = 4;
const LGOLD    = [196,150,58], LROSE = [200,80,108];
let   positions = [], phase = 0, lightSpeed = 0.045;

function buildPositions() {
  positions = [];
  const W=canvas.width, H=canvas.height;
  const x0=MARGIN,y0=MARGIN,x1=W-MARGIN,y1=H-MARGIN;
  for (let x=x0;x<=x1;x+=SPACING) positions.push([x,y0]);
  for (let y=y0+SPACING;y<=y1;y+=SPACING) positions.push([x1,y]);
  for (let x=x1-SPACING;x>=x0;x-=SPACING) positions.push([x,y1]);
  for (let y=y1-SPACING;y>y0;y-=SPACING) positions.push([x0,y]);
}
function resizeCanvas() {
  canvas.width=window.innerWidth; canvas.height=window.innerHeight; buildPositions();
}
resizeCanvas();
window.addEventListener('resize', () => { resizeCanvas(); initPhysics(); });

function brightness(idx,count,ph){ return Math.max(0,Math.sin((idx/count)*WAVES*Math.PI*2-ph)); }
function lerp(a,b,t){ return a+(b-a)*t; }

function drawLights() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  lightSpeed = (animating || document.body.classList.contains('revealing')) ? 0.11 : 0.045;
  phase += lightSpeed;
  const N = positions.length;
  positions.forEach(([x,y],i) => {
    const goldB=brightness(i,N,phase), roseB=brightness(i,N,phase+Math.PI*0.65);
    const maxB=Math.max(goldB,roseB);
    ctx.beginPath(); ctx.arc(x,y,R_OFF,0,Math.PI*2);
    ctx.fillStyle='rgba(70,25,35,0.55)'; ctx.fill();
    if (maxB<0.04) return;
    const blend=roseB/(goldB+roseB+0.001);
    const r=Math.round(lerp(LGOLD[0],LROSE[0],blend));
    const g=Math.round(lerp(LGOLD[1],LROSE[1],blend));
    const b=Math.round(lerp(LGOLD[2],LROSE[2],blend));
    const alpha=0.15+maxB*0.85;
    const glowR=R_ON*(2.5+maxB*3.2);
    const grd=ctx.createRadialGradient(x,y,0,x,y,glowR);
    grd.addColorStop(0,`rgba(${r},${g},${b},${alpha})`);
    grd.addColorStop(0.35,`rgba(${r},${g},${b},${alpha*0.4})`);
    grd.addColorStop(1,`rgba(${r},${g},${b},0)`);
    ctx.beginPath(); ctx.arc(x,y,glowR,0,Math.PI*2); ctx.fillStyle=grd; ctx.fill();
    ctx.beginPath(); ctx.arc(x,y,R_ON,0,Math.PI*2);
    ctx.fillStyle=`rgba(${r},${g},${b},${alpha})`; ctx.fill();
  });
  requestAnimationFrame(drawLights);
}
requestAnimationFrame(drawLights);

/* ── WAKE LOCK ── */
if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(()=>{});

/* ── INIT ── */
requestAnimationFrame(() => {
  initPhysics();
  requestAnimationFrame(physicsLoop);
  updateUI();
  tryLoadFromURL();
});
</script>
